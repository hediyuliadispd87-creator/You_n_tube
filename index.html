<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>YouTube Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red: #ff0000;
      --red2: #ff4444;
      --dark: #0a0a0a;
      --card-bg: #111;
      --white: #ffffff;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--dark);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* ═══ LANDING ═══ */
    #landing {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    #landing.hidden {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    /* background noise + gradient */
    #landing::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, rgba(255,0,0,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 20% 80%, rgba(255,80,0,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* scan lines */
    #landing::after {
      content: '';
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(255,255,255,0.015) 3px,
        rgba(255,255,255,0.015) 4px
      );
      pointer-events: none;
    }

    /* floating particles */
    .particles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .particle {
      position: absolute;
      border-radius: 50%;
      animation: floatP linear infinite;
      opacity: 0;
    }
    @keyframes floatP {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* card */
    .card {
      position: relative;
      background: linear-gradient(160deg, #1a1a1a 0%, #111 100%);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 48px 40px 40px;
      width: 92%;
      max-width: 400px;
      text-align: center;
      box-shadow:
        0 0 80px rgba(255,0,0,0.1),
        0 40px 80px rgba(0,0,0,0.7),
        inset 0 1px 0 rgba(255,255,255,0.07);
      animation: cardIn 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(50px) scale(0.9); }
      to   { opacity:1; transform: none; }
    }

    /* red top accent */
    .card-accent {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 80px; height: 3px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      border-radius: 0 0 4px 4px;
    }

    /* YouTube logo */
    .yt-logo {
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      animation: logoPop 0.6s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes logoPop {
      from { opacity:0; transform: scale(0.5); }
      to   { opacity:1; transform: scale(1); }
    }
    .yt-icon {
      width: 56px; height: 40px;
      background: var(--red);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px rgba(255,0,0,0.5);
      position: relative;
    }
    .yt-icon::after {
      content: '';
      border-style: solid;
      border-width: 9px 0 9px 18px;
      border-color: transparent transparent transparent #fff;
      margin-left: 3px;
    }
    .yt-wordmark {
      font-family: 'Anton', sans-serif;
      font-size: 1.7rem;
      color: #fff;
      letter-spacing: 1px;
    }

    /* video thumbnail preview */
    .thumb-preview {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #1e1e1e;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .thumb-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex; align-items: center; justify-content: center;
    }
    .play-icon {
      width: 56px; height: 56px;
      background: rgba(255,0,0,0.9);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(255,0,0,0.6);
      animation: playPulse 2s ease-in-out infinite;
    }
    .play-icon::after {
      content:'';
      border-style: solid;
      border-width: 10px 0 10px 20px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }
    @keyframes playPulse {
      0%,100% { transform: scale(1); box-shadow: 0 4px 24px rgba(255,0,0,0.6); }
      50%      { transform: scale(1.08); box-shadow: 0 4px 40px rgba(255,0,0,0.9); }
    }
    .thumb-duration {
      position: absolute;
      bottom: 8px; right: 10px;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .video-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .video-meta {
      font-size: 0.78rem;
      color: rgba(255,255,255,0.35);
      margin-bottom: 32px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,0.25); }

    /* button */
    .btn-tonton {
      position: relative;
      width: 100%;
      padding: 15px 24px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.5px;
      color: #fff;
      background: var(--red);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 24px rgba(255,0,0,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-tonton:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 36px rgba(255,0,0,0.6);
    }
    .btn-tonton:active { transform: translateY(1px); }
    .btn-tonton::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.1) 50%, transparent 100%);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }
    .btn-tonton:hover::before { transform: translateX(100%); }

    .btn-progress {
      position: absolute; bottom: 0; left: 0;
      height: 3px; width: 0;
      background: rgba(255,255,255,0.7);
      transition: width 0.8s ease;
    }
    .btn-tonton.loading .btn-progress { width: 100%; }

    .footnote {
      margin-top: 14px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
    }

    /* ═══ WEBVIEW ═══ */
    #webview-wrap {
      position: fixed; inset: 0;
      display: none; flex-direction: column;
      background: #000;
      z-index: 5;
    }
    #webview-wrap.visible { display: flex; }

    .wv-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px;
      background: #111;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      min-height: 50px;
      flex-shrink: 0;
    }
    .wv-btn {
      background: rgba(255,255,255,0.07);
      border: none; color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .wv-btn:hover { background: rgba(255,0,0,0.35); }

    .wv-url-bar {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 7px 14px;
      color: rgba(255,255,255,0.5);
      font-size: 0.78rem;
      font-family: 'DM Sans', sans-serif;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .yt-badge {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      background: var(--red);
      border-radius: 20px;
      flex-shrink: 0;
    }
    .yt-badge-icon {
      width: 18px; height: 13px;
      background: #fff;
      border-radius: 4px;
      position: relative;
      flex-shrink: 0;
    }
    .yt-badge-icon::after {
      content: '';
      position: absolute;
      top: 50%; left: 52%;
      transform: translate(-50%,-50%);
      border-style: solid;
      border-width: 4px 0 4px 8px;
      border-color: transparent transparent transparent var(--red);
    }
    .yt-badge span {
      font-size: 0.72rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .wv-progress-bar {
      height: 2px; width: 0;
      background: var(--red);
      transition: width 0.4s ease;
      flex-shrink: 0;
      box-shadow: 0 0 8px rgba(255,0,0,0.8);
    }

    .wv-frame-area {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    .wv-loader {
      position: absolute; inset: 0;
      background: #000;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: opacity 0.5s;
    }
    .wv-loader.done { opacity: 0; pointer-events: none; }
    .yt-spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wv-loader-text {
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.5px;
    }

    #yt-frame {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>

<!-- ═══ LANDING ═══ -->
<div id="landing">
  <div class="particles" id="particles"></div>

  <div class="card">
    <div class="card-accent"></div>

    <div class="yt-logo">
      <div class="yt-icon"></div>
      <span class="yt-wordmark">YouTube</span>
    </div>

    <div class="thumb-preview">
      <img
        class="thumb-img"
        src="https://img.youtube.com/vi/kBPhOzJpHC8/maxresdefault.jpg"
        alt="Video Thumbnail"
        onerror="this.src='https://img.youtube.com/vi/kBPhOzJpHC8/hqdefault.jpg'"
      />
      <div class="thumb-overlay">
        <div class="play-icon"></div>
      </div>
      <span class="thumb-duration">▶</span>
    </div>

    <p class="video-title">Tonton Video Ini di YouTube</p>
    <div class="video-meta">
      <span>youtu.be/kBPhOzJpHC8</span>
      <span class="dot"></span>
      <span>YouTube</span>
    </div>

    <button class="btn-tonton" id="btnMasuk" onclick="masuk()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      Tonton Sekarang
      <div class="btn-progress" id="btnProgress"></div>
    </button>
    <p class="footnote">Video akan dibuka dalam pemutar bawaan</p>
  </div>
</div>

<!-- ═══ WEBVIEW ═══ -->
<div id="webview-wrap">
  <div class="wv-bar">
    <button class="wv-btn" onclick="kembali()" title="Kembali">←</button>
    <div class="wv-url-bar">youtube.com/watch?v=kBPhOzJpHC8</div>
    <div class="yt-badge">
      <div class="yt-badge-icon"></div>
      <span>YouTube</span>
    </div>
    <button class="wv-btn" onclick="reloadFrame()" title="Reload">↻</button>
  </div>
  <div class="wv-progress-bar" id="wvProg"></div>
  <div class="wv-frame-area">
    <div class="wv-loader" id="wvLoader">
      <div class="yt-spinner"></div>
      <div class="wv-loader-text">Memuat video…</div>
    </div>
    <iframe
      id="yt-frame"
      src="about:blank"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
      allowfullscreen
      title="YouTube Video"
    ></iframe>
  </div>
</div>

<script>
  // particles
  const pc = document.getElementById('particles');
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 3 + Math.random() * 5;
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      background: ${Math.random() > 0.5 ? 'rgba(255,0,0,0.5)' : 'rgba(255,255,255,0.2)'};
      animation-duration: ${6 + Math.random()*10}s;
      animation-delay: ${Math.random()*10}s;
    `;
    pc.appendChild(p);
  }

  const VIDEO_ID = 'kBPhOzJpHC8';
  // Use YouTube embed URL with autoplay
  const EMBED_URL = `https://www.youtube.com/embed/${VIDEO_ID}?autoplay=1&rel=0&modestbranding=1`;

  function masuk() {
    const btn  = document.getElementById('btnMasuk');
    const prog = document.getElementById('btnProgress');
    btn.classList.add('loading');
    btn.style.pointerEvents = 'none';

    setTimeout(() => {
      document.getElementById('landing').classList.add('hidden');
      setTimeout(() => {
        const wrap   = document.getElementById('webview-wrap');
        const frame  = document.getElementById('yt-frame');
        const loader = document.getElementById('wvLoader');
        const wvp    = document.getElementById('wvProg');

        wrap.classList.add('visible');
        wvp.style.width = '55%';
        setTimeout(() => wvp.style.width = '85%', 500);

        frame.src = EMBED_URL;
        frame.onload = () => {
          wvp.style.width = '100%';
          setTimeout(() => {
            wvp.style.opacity = '0';
            loader.classList.add('done');
          }, 300);
        };
      }, 350);
    }, 800);
  }

  function kembali() {
    const frame  = document.getElementById('yt-frame');
    const loader = document.getElementById('wvLoader');
    const wvp    = document.getElementById('wvProg');
    const btn    = document.getElementById('btnMasuk');

    document.getElementById('webview-wrap').classList.remove('visible');
    document.getElementById('landing').classList.remove('hidden');

    frame.src = 'about:blank';
    loader.classList.remove('done');
    wvp.style.width = '0';
    wvp.style.opacity = '1';
    btn.classList.remove('loading');
    btn.style.pointerEvents = '';
  }

  function reloadFrame() {
    const frame  = document.getElementById('yt-frame');
    const loader = document.getElementById('wvLoader');
    const wvp    = document.getElementById('wvProg');

    loader.classList.remove('done');
    wvp.style.opacity = '1';
    wvp.style.width = '40%';
    frame.src = EMBED_URL;
    frame.onload = () => {
      wvp.style.width = '100%';
      setTimeout(() => { wvp.style.opacity = '0'; loader.classList.add('done'); }, 300);
    };
  }
</script>
</body>
</html>
